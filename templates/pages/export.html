{% extends "base.html" %}

{% block content %}

<div class="flex h-[calc(100vh-72px)] flex-col overflow-hidden">

  <div class="flex flex-1 overflow-hidden">

    {% include "partials/export_sidebar.html" %}

    <main
      id="export-scroll"
      class="flex-1 overflow-y-auto snap-y snap-mandatory scroll-smooth"
    >
      {% include "partials/export_content.html" %}
    </main>

  </div>

</div>

{% include "partials/export_modals.html" %}

<script>
const container = document.getElementById("export-scroll");

const sections = [...document.querySelectorAll(".export-section")];

const sidebarLinks = [...document.querySelectorAll(".section-link")];

const currentTitle = document.getElementById("current-section-title");

let current = 0;

/* ----------------------------------
   Sidebar Active State
----------------------------------- */

const observer = new IntersectionObserver(
  (entries) => {
    entries.forEach((entry) => {
      if (!entry.isIntersecting) return;

      current = sections.indexOf(entry.target);

      sidebarLinks.forEach((link) => {
        link.classList.remove(
          "bg-[#F2F4F7]",
          "text-[#101828]",
          "shadow-sm"
        );
      });

      const active = document.querySelector(
        `.section-link[data-target="${entry.target.id}"]`
      );

      if (!active) return;

      active.classList.add(
        "bg-[#F2F4F7]",
        "text-[#101828]",
        "shadow-sm"
      );

      const title = active.querySelector(".section-title");

      if (title) {
        currentTitle.textContent = title.textContent.trim();
      }
    });
  },
  {
    root: container,
    threshold: 0.5,
  }
);

sections.forEach((section) => observer.observe(section));

/* ----------------------------------
   Sidebar Navigation
----------------------------------- */

sidebarLinks.forEach((link) => {
  link.addEventListener("click", (e) => {
    e.preventDefault();

    const target = document.getElementById(link.dataset.target);

    if (!target) return;

    container.scrollTo({
      top: target.offsetTop,
      behavior: "smooth",
    });
  });
});

/* ----------------------------------
   Sync current index
----------------------------------- */

container.addEventListener("scroll", () => {
  const scrollTop = container.scrollTop;

  sections.forEach((section, index) => {
    if (
      scrollTop >= section.offsetTop - 80 &&
      scrollTop < section.offsetTop + section.offsetHeight - 80
    ) {
      current = index;
    }
  });
});

/* ----------------------------------
   Section Snap Wheel
----------------------------------- */

let locked = false;

container.addEventListener(
  "wheel",
  (e) => {
    e.preventDefault();

    if (locked) return;

    locked = true;

    if (e.deltaY > 0 && current < sections.length - 1) {
      current++;
    }

    if (e.deltaY < 0 && current > 0) {
      current--;
    }

    container.scrollTo({
      top: sections[current].offsetTop,
      behavior: "smooth",
    });

    setTimeout(() => {
      locked = false;
    }, 650);
  },
  {
    passive: false,
  }
);
</script>

{% endblock %}
