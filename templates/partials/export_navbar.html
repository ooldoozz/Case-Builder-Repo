<nav class="export-navbar">
  <div class="export-navbar__left">
    <a href="/" class="export-brand" aria-label="Case Builder home">
      <span class="export-brand__mark">CB</span>
      <span class="export-brand__name">Case Builder</span>
    </a>
    <span class="export-breadcrumb__separator">›</span>
    <a href="/archive" class="export-breadcrumb__link">Archive</a>
    <span class="export-breadcrumb__separator">›</span>
    <span class="export-breadcrumb__current">{{ case.title }}</span>

    {% if issues_count > 0 %}
    <span class="export-issues-pill">
      <span class="export-issues-pill__dot"></span>
      {{ issues_count }} section{{ "s" if issues_count != 1 else "" }} need attention
    </span>
    {% else %}
    <span class="export-complete-pill">✓ All sections complete</span>
    {% endif %}
  </div>

  <div class="export-navbar__actions">
    <a href="/cases/{{ case.id }}/edit" class="export-button export-button--secondary">Back to edit</a>
    <button id="open-export-modal" type="button" class="export-button export-button--primary">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M8 2v8m0 0 3-3m-3 3L5 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M3 11.5v1A1.5 1.5 0 0 0 4.5 14h7a1.5 1.5 0 0 0 1.5-1.5v-1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      Export
    </button>
  </div>
</nav>
