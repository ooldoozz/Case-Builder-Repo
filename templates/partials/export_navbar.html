<nav
  class="sticky top-0 z-50 h-[72px] shrink-0 border-b border-[#E4E7EC] bg-white/90 backdrop-blur"
>
  <div class="flex h-full items-center justify-between px-10">
    <div class="flex min-w-0 flex-1 items-center gap-3 text-[15px]">
      <a href="/" class="flex shrink-0 items-center gap-3">
        <!-- Logo -->
        ...
        <span class="text-[18px] font-bold text-[#101828]">Case Builder</span>
      </a>

      <a
        href="/archive"
        class="shrink-0 font-medium text-[#667085] transition hover:text-[#101828]"
      >
        Archive
      </a>

      <svg class="shrink-0" width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path
          d="M6 3L10 8L6 13"
          stroke="#98A2B3"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>

      <span class="truncate text-[#667085]">
        {{ case.title }}
      </span>

      <svg class="shrink-0" width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path
          d="M6 3L10 8L6 13"
          stroke="#98A2B3"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>

      <span
        id="current-section-title"
        class="truncate font-semibold text-[#101828]"
      >
        {{ sections[0].title }}
      </span>
    </div>

    <div class="ml-6 flex shrink-0 items-center gap-3">
      {% if progress == 100 %}

      <span
        class="inline-flex shrink-0 items-center gap-2 rounded-full border border-[#BBF7D0] bg-[#ECFDF3] px-4 py-2 text-sm font-semibold text-[#007A55]"
      >
        <svg
          width="13"
          height="13"
          viewBox="0 0 13 13"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <g clip-path="url(#clip0_2312_1389)">
            <path
              d="M6.50016 11.9167C9.49171 11.9167 11.9168 9.49154 11.9168 6.5C11.9168 3.50845 9.49171 1.08333 6.50016 1.08333C3.50862 1.08333 1.0835 3.50845 1.0835 6.5C1.0835 9.49154 3.50862 11.9167 6.50016 11.9167Z"
              stroke="#00BC7D"
              stroke-width="1.08333"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M4.875 6.50001L5.95833 7.58334L8.125 5.41667"
              stroke="#00BC7D"
              stroke-width="1.08333"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </g>
          <defs>
            <clipPath id="clip0_2312_1389">
              <rect width="13" height="13" fill="white" />
            </clipPath>
          </defs>
        </svg>

        All complete
      </span>

      {% else %}

      <span
        class="inline-flex shrink-0 items-center gap-2 rounded-full border border-[#FED7AA] bg-[#FFF7ED] px-4 py-2 text-sm font-semibold text-[#C2410C]"
      >
        <svg
          width="12"
          height="12"
          viewBox="0 0 12 12"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <g clip-path="url(#clip0_2312_1375)">
            <path
              d="M6 11C8.76142 11 11 8.76142 11 6C11 3.23858 8.76142 1 6 1C3.23858 1 1 3.23858 1 6C1 8.76142 3.23858 11 6 11Z"
              stroke="#FE9A00"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M6 4V6"
              stroke="#FE9A00"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path
              d="M6 8H6.005"
              stroke="#FE9A00"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </g>
          <defs>
            <clipPath id="clip0_2312_1375">
              <rect width="12" height="12" fill="white" />
            </clipPath>
          </defs>
        </svg>

        {{ issues_count }} issue{{ "s" if issues_count != 1 else "" }}
      </span>

      {% endif %}
    </div>
  </div>
</nav>
