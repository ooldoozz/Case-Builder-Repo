<aside class="export-sidebar">
  <div class="export-sidebar__case">
    <p class="export-sidebar__eyebrow">Current case</p>
    <div class="export-sidebar__case-row">
      <h1>{{ case.title }}</h1>
      <button type="button" class="export-icon-button" aria-label="Case options">•••</button>
    </div>
  </div>

  <div class="export-sidebar__tabs" role="tablist" aria-label="Preview sidebar">
    <button
      type="button"
      class="export-sidebar__tab is-active"
      id="sidebar-sections-tab"
      role="tab"
      aria-selected="true"
      aria-controls="sidebar-sections-panel"
      data-sidebar-tab="sections"
    >
      Sections
    </button>
    <button
      type="button"
      class="export-sidebar__tab"
      id="sidebar-tools-tab"
      role="tab"
      aria-selected="false"
      aria-controls="sidebar-tools-panel"
      data-sidebar-tab="tools"
    >
      Tools
    </button>
  </div>

  <div class="export-sidebar__body">
    <section
      id="sidebar-sections-panel"
      class="export-sidebar__panel is-active"
      role="tabpanel"
      aria-labelledby="sidebar-sections-tab"
      data-sidebar-panel="sections"
    >
      <p class="export-sidebar__section-label">Sections</p>
      <nav class="export-section-nav" aria-label="Case study sections">
        <button type="button" class="export-section-link is-active" data-target="preview-cover">
          <span class="status-dot status-dot--cover"></span>
          <span>Cover</span>
        </button>
        {% for section in sections %}
        <button type="button" class="export-section-link" data-target="{{ section.key }}">
          <span class="status-dot status-dot--{{ section.status }}"></span>
          <span>{{ section.title }}</span>
        </button>
        {% endfor %}
      </nav>
    </section>

    <section
      id="sidebar-tools-panel"
      class="export-sidebar__panel"
      role="tabpanel"
      aria-labelledby="sidebar-tools-tab"
      data-sidebar-panel="tools"
      hidden
    >
      {% include "partials/export_layout_panel.html" %}
    </section>
  </div>
</aside>
